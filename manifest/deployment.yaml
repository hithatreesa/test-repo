apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-repo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-repo
  template:
    metadata:
      labels:
        app: test-repo
    spec:
      containers:
        - name: test-repo
          image: hithatreesathomas/test-repo:latest
          ports:
            - containerPort: 80